name: Build Daily Journal

on:
  # 每天UTC时间0点自动触发 (对应北京时间早上8点)
  schedule:
    - cron: '0 0 * * *'
    
  # 手动触发
  workflow_dispatch:
  
jobs:
  build-book:
    runs-on: ubuntu-latest
      
    # 需要写入权限来提交生成的文件和归档的日刊
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 明确指定要检出的分支
          ref: 'book'

      - name: Archive old notes
        id: archive
        run: |
          echo "开始检查并归档旧的日刊..."
          # 查找最新文件以确定当前月份
          LATEST_DAILY_FILE=$(find daily -type f -name "*.md" | sort -r | head -n 1)
          if [ -z "$LATEST_DAILY_FILE" ]; then
            echo "在 'daily' 目录中没有找到任何 .md 文件，跳过归档步骤。"
            exit 0
          fi
          
          LATEST_MONTH=$(basename "$LATEST_DAILY_FILE" .md | cut -d'-' -f1,2)
          echo "当前最新月份是: $LATEST_MONTH"

          # 仅遍历 daily/ 根目录下的 md 文件进行归档
          for file in daily/*.md; do
            # 如果根目录下没有md文件，循环会匹配到 "daily/*.md" 字符串，需要跳过
            [ -e "$file" ] || continue
            
            FILE_MONTH=$(basename "$file" .md | cut -d'-' -f1,2)
            
            if [ "$FILE_MONTH" != "$LATEST_MONTH" ]; then
              TARGET_DIR="daily/$FILE_MONTH"
              mkdir -p "$TARGET_DIR"
              echo "归档文件: $file -> $TARGET_DIR/"
              mv "$file" "$TARGET_DIR/"
            fi
          done
          echo "文件归档检查完成。"

      - name: Fetch data from sources (writeData)
        run: |
          # 检查 `WORKER_URL` 变量是否已设置
          if [ -z "${{ vars.WORKER_URL }}" ]; then
            echo "警告: WORKER_URL 仓库变量未设置或为空，跳过此步骤。"
            exit 0
          fi

          FULL_URL="${{ vars.WORKER_URL }}/writeData"
          
          echo "正在抓取数据..."
          echo "URL: $FULL_URL"
          
          # 使用 curl 发起 POST 请求
          if curl -fsS --retry 3 --retry-delay 5 --retry-connrefused -X POST "$FULL_URL"; then
            echo "数据抓取成功。"
          else
            echo "错误：数据抓取失败。"
            exit 1
          fi

      - name: Auto generate daily report
        run: |
          # 检查 `WORKER_URL` 变量是否已设置
          if [ -z "${{ vars.WORKER_URL }}" ]; then
            echo "警告: WORKER_URL 仓库变量未设置或为空，跳过此步骤。"
            exit 0
          fi

          # 设置时区为 Asia/Shanghai (东八区)，并获取 YYYY-MM-DD 格式的日期
          TODAY_DATE=$(TZ="Asia/Shanghai" date +%Y-%m-%d)
          FULL_URL="${{ vars.WORKER_URL }}/autoGenerateDaily?date=$TODAY_DATE"
          
          echo "正在自动生成日报..."
          echo "URL: $FULL_URL"
          
          # 使用 curl 发起请求，设置较长的超时时间（AI 生成可能需要较长时间）
          if curl -fsS --retry 3 --retry-delay 10 --retry-connrefused --max-time 600 "$FULL_URL"; then
            echo "日报生成成功。"
          else
            echo "错误：日报生成失败。"
            exit 1
          fi
          
      - name: Download RSS Feed
        run: |
          if [ -z "${{ vars.RSS_FEED_URL }}" ]; then
            echo "警告: RSS_FEED_URL 仓库变量未设置或为空，跳过下载。"
          else
            echo "正在从 ${{ vars.RSS_FEED_URL }} 下载 RSS Feed..."
            if wget -O rss.xml "${{ vars.RSS_FEED_URL }}" --timeout=30 --tries=3; then
              echo "RSS Feed 已成功下载到 rss.xml"
            else
              echo "错误: 下载 RSS Feed 失败。wget 返回错误码 $?。"
            fi
          fi
          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add today/ daily/ rss/
          if [ -f "rss.xml" ]; then
            git add rss.xml
          else
            echo "rss.xml 未找到，不添加到提交中。"
          fi

          if git diff --staged --quiet; then
            echo "没有文件变更，无需提交。"
          else
            echo "检测到文件变更，正在提交..."
            git commit -m "docs: 自动构建日刊并归档旧月份 (`date -u`)"
            git push
          fi