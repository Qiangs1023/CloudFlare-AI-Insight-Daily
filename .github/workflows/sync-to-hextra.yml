name: Sync to Hextra

on:
  push:
    branches: [book]
    paths: ['daily/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout source repo (book branch)
        uses: actions/checkout@v4
        with:
          ref: book
          fetch-depth: 1
      
      - name: Checkout target repo (Hextra)
        uses: actions/checkout@v4
        with:
          repository: Qiangs1023/Hextra-AI-Insight-Daily
          ref: main
          token: ${{ secrets.HEXTRA_REPO_TOKEN }}
          path: hextra
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Sync Chinese content to content/cn
        run: |
          echo "同步中文内容到 content/cn 目录..."
          mkdir -p hextra/content/cn
          rsync -av --delete --exclude='*/' daily/ hextra/content/cn/
          echo "=== content/cn ==="
          ls -la hextra/content/cn/
      
      - name: Translate and sync to content/en
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "翻译并同步英文内容到 content/en 目录..."
          mkdir -p hextra/content/en
          
          # 安装翻译依赖
          npm install marked
          
          # 创建翻译脚本
          cat > translate.js << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          async function translateContent(content, apiKey) {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [
                  {
                    role: 'system',
                    content: 'You are a professional translator. Translate the following Chinese markdown content to English. Keep all markdown formatting, links, and code blocks unchanged. Only output the translated content, no explanations.'
                  },
                  {
                    role: 'user',
                    content: content
                  }
                ],
                temperature: 0.3
              })
            });
            
            if (!response.ok) {
              throw new Error(`Translation failed: ${response.status}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
          }
          
          async function main() {
            const apiKey = process.env.OPENAI_API_KEY;
            if (!apiKey) {
              console.error('OPENAI_API_KEY not set');
              process.exit(1);
            }
            
            const dailyDir = 'daily';
            const enDir = 'hextra/content/en';
            
            // 获取所有 md 文件
            const files = fs.readdirSync(dailyDir).filter(f => f.endsWith('.md'));
            console.log(`Found ${files.length} files to translate`);
            
            for (const file of files) {
              const srcPath = path.join(dailyDir, file);
              const destPath = path.join(enDir, file);
              
              // 检查目标文件是否已存在且较新
              if (fs.existsSync(destPath)) {
                const srcStat = fs.statSync(srcPath);
                const destStat = fs.statSync(destPath);
                if (destStat.mtime >= srcStat.mtime) {
                  console.log(`Skipping ${file} (already translated and up-to-date)`);
                  continue;
                }
              }
              
              console.log(`Translating ${file}...`);
              const content = fs.readFileSync(srcPath, 'utf-8');
              
              try {
                const translated = await translateContent(content, apiKey);
                fs.writeFileSync(destPath, translated);
                console.log(`Translated ${file} successfully`);
                
                // 避免请求过快
                await new Promise(r => setTimeout(r, 1000));
              } catch (error) {
                console.error(`Failed to translate ${file}:`, error.message);
                // 翻译失败时复制原文
                fs.copyFileSync(srcPath, destPath);
              }
            }
            
            console.log('Translation completed');
          }
          
          main().catch(console.error);
          SCRIPT
          
          # 运行翻译脚本
          node translate.js
          
          echo "=== content/en ==="
          ls -la hextra/content/en/
      
      - name: Commit and push to Hextra repo
        run: |
          cd hextra
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add content/
          
          if git diff --staged --quiet; then
            echo "没有文件变更，无需提交。"
          else
            echo "检测到文件变更，正在提交..."
            git commit -m "docs: 同步日报内容 (cn + en translation) (`date -u +%Y-%m-%d`)"
            git push
            echo "推送成功!"
          fi
