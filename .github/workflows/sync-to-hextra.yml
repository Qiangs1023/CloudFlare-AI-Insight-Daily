name: Sync to Hextra

on:
  push:
    branches: [book]
    paths: ['daily/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout source repo (book branch)
        uses: actions/checkout@v4
        with:
          ref: book
          fetch-depth: 1
      
      - name: Checkout target repo (Hextra)
        uses: actions/checkout@v4
        with:
          repository: Qiangs1023/Hextra-AI-Insight-Daily
          ref: main
          token: ${{ secrets.HEXTRA_REPO_TOKEN }}
          path: hextra
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Sync Chinese content to content/cn/YYYY-MM/
        run: |
          echo "同步中文内容到 content/cn/年-月/ 目录..."
          
          # 遍历 daily 目录下的 md 文件
          for file in daily/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # 从文件名提取年月 (格式: YYYY-MM-DD.md)
              year_month=$(echo "$filename" | cut -d'-' -f1,2)
              
              # 创建目标目录
              mkdir -p "hextra/content/cn/$year_month"
              
              # 复制文件
              cp "$file" "hextra/content/cn/$year_month/"
              echo "Copied: $file -> hextra/content/cn/$year_month/$filename"
            fi
          done
          
          echo "=== content/cn 目录结构 ==="
          ls -la hextra/content/cn/
          for dir in hextra/content/cn/*/; do
            if [ -d "$dir" ]; then
              echo "--- $dir ---"
              ls -la "$dir"
            fi
          done
      
      - name: Translate and sync to content/en/YYYY-MM/
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "翻译并同步英文内容到 content/en/年-月/ 目录..."
          
          # 创建翻译脚本
          cat > translate.js << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          async function translateContent(content, apiKey) {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
              },
              body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                  {
                    role: 'system',
                    content: 'You are a professional translator. Translate the following Chinese markdown content to English. Keep all markdown formatting, links, and code blocks unchanged. Only output the translated content, no explanations.'
                  },
                  {
                    role: 'user',
                    content: content
                  }
                ],
                temperature: 0.3
              })
            });
            
            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`Translation failed: ${response.status} - ${errorText}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
          }
          
          async function main() {
            const apiKey = process.env.DEEPSEEK_API_KEY;
            if (!apiKey) {
              console.error('DEEPSEEK_API_KEY not set');
              process.exit(1);
            }
            
            const dailyDir = 'daily';
            const enBaseDir = 'hextra/content/en';
            
            // 获取所有 md 文件
            const files = fs.readdirSync(dailyDir).filter(f => f.endsWith('.md'));
            console.log(`Found ${files.length} files to process`);
            
            for (const file of files) {
              // 从文件名提取年月 (格式: YYYY-MM-DD.md)
              const yearMonth = file.substring(0, 7); // YYYY-MM
              const srcPath = path.join(dailyDir, file);
              const destDir = path.join(enBaseDir, yearMonth);
              const destPath = path.join(destDir, file);
              
              // 创建目标目录
              fs.mkdirSync(destDir, { recursive: true });
              
              // 检查目标文件是否已存在且较新
              if (fs.existsSync(destPath)) {
                const srcStat = fs.statSync(srcPath);
                const destStat = fs.statSync(destPath);
                if (destStat.mtime >= srcStat.mtime) {
                  console.log(`Skipping ${file} (already translated and up-to-date)`);
                  continue;
                }
              }
              
              console.log(`Translating ${file}...`);
              const content = fs.readFileSync(srcPath, 'utf-8');
              
              try {
                const translated = await translateContent(content, apiKey);
                fs.writeFileSync(destPath, translated);
                console.log(`Translated ${file} -> content/en/${yearMonth}/${file}`);
                
                // 避免请求过快
                await new Promise(r => setTimeout(r, 1000));
              } catch (error) {
                console.error(`Failed to translate ${file}:`, error.message);
                // 翻译失败时复制原文
                fs.copyFileSync(srcPath, destPath);
                console.log(`Copied original ${file} due to translation failure`);
              }
            }
            
            console.log('Translation completed');
          }
          
          main().catch(console.error);
          SCRIPT
          
          # 运行翻译脚本
          node translate.js
          
          echo "=== content/en 目录结构 ==="
          ls -la hextra/content/en/
          for dir in hextra/content/en/*/; do
            if [ -d "$dir" ]; then
              echo "--- $dir ---"
              ls -la "$dir"
            fi
          done
      
      - name: Commit and push to Hextra repo
        run: |
          cd hextra
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add content/
          
          if git diff --staged --quiet; then
            echo "没有文件变更，无需提交。"
          else
            echo "检测到文件变更，正在提交..."
            git commit -m "docs: 同步日报内容 (cn + en translation) (`date -u +%Y-%m-%d`)"
            git push
            echo "推送成功!"
          fi