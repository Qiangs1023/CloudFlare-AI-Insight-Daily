name: Sync to Hextra

on:
  push:
    branches: [book]
    paths: ['daily/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout source repo (book branch)
        uses: actions/checkout@v4
        with:
          ref: book
          fetch-depth: 1
      
      - name: Checkout target repo (Hextra)
        uses: actions/checkout@v4
        with:
          repository: Qiangs1023/Hextra-AI-Insight-Daily
          ref: main
          token: ${{ secrets.HEXTRA_REPO_TOKEN }}
          path: hextra
          fetch-depth: 1
      
      - name: Sync daily content to content/cn/YYYY-MM/
        run: |
          echo "同步日报内容到 content/cn/年-月/ 目录..."
          
          # 遍历 daily 目录下的 md 文件
          for file in daily/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # 从文件名提取年月 (格式: YYYY-MM-DD.md)
              year_month=$(echo "$filename" | cut -d'-' -f1,2)
              
              # 创建目标目录 (如果不存在)
              mkdir -p "hextra/content/cn/$year_month"
              
              # 复制文件
              cp "$file" "hextra/content/cn/$year_month/"
              echo "Copied: $file -> hextra/content/cn/$year_month/$filename"
            fi
          done
          
          echo "=== content/cn 目录结构 ==="
          ls -la hextra/content/cn/
      
      - name: Commit and push to Hextra repo
        run: |
          cd hextra
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add content/
          
          if git diff --staged --quiet; then
            echo "没有文件变更，无需提交。"
          else
            echo "检测到文件变更，正在提交..."
            git commit -m "docs: 同步日报内容 (`date -u +%Y-%m-%d`)"
            git push
            echo "推送成功!"
          fi
