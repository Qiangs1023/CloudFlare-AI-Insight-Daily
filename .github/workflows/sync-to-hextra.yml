name: Sync to Hextra

on:
  push:
    branches: [book]
    paths: ['daily/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout source repo (book branch)
        uses: actions/checkout@v4
        with:
          ref: book
          fetch-depth: 1
      
      - name: Checkout target repo (Hextra)
        uses: actions/checkout@v4
        with:
          repository: Qiangs1023/Hextra-AI-Insight-Daily
          ref: main
          token: ${{ secrets.HEXTRA_REPO_TOKEN }}
          path: hextra
          fetch-depth: 1
      
      - name: Sync daily content to content/cn/YYYY-MM/ with front matter
        run: |
          echo "同步日报内容到 content/cn/年-月/ 目录..."
          
          DESCRIPTION="个人每日整理的AI资讯站。我们为您过滤信息噪音，只提供最精选的AI新闻、最实用的AI工具与AI教程，助您高效获取人工智能领域的前沿动态"
          
          # 遍历 daily 目录下的 md 文件
          for file in daily/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # 从文件名提取日期 (格式: YYYY-MM-DD.md)
              year_month=$(echo "$filename" | cut -d'-' -f1,2)
              YEAR=$(echo "$filename" | cut -c 1-4)
              MONTH=$(echo "$filename" | cut -c 6-7)
              DAY=$(echo "$filename" | cut -c 9-10)
              DAY_NO_ZERO=$(echo $DAY | sed 's/^0*//')
              weight=$((32 - DAY_NO_ZERO))
              
              # 创建目标目录 (如果不存在)
              mkdir -p "hextra/content/cn/$year_month"
              
              # 读取原始内容
              original_content=$(cat "$file")
              
              # 生成带 front matter 的新内容
              {
                printf -- "---\n"
                printf -- "linkTitle: %s-%s-日报\n" "$MONTH" "$DAY"
                printf -- "title: %s-%s-日报-AI资讯日报\n" "$MONTH" "$DAY"
                printf -- "weight: %d\n" "$weight"
                printf -- "breadcrumbs: false\n"
                printf -- "comments: true\n"
                printf -- "description: \"%s\"\n" "$DESCRIPTION"
                printf -- "---\n\n"
                echo "$original_content"
              } > "hextra/content/cn/$year_month/$filename"
              
              echo "Processed: $file -> hextra/content/cn/$year_month/$filename"
            fi
          done
          
          echo "=== content/cn 目录结构 ==="
          ls -la hextra/content/cn/
      
      - name: Commit and push to Hextra repo
        run: |
          cd hextra
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add content/
          
          if git diff --staged --quiet; then
            echo "没有文件变更，无需提交。"
          else
            echo "检测到文件变更，正在提交..."
            git commit -m "docs: 同步日报内容 (`date -u +%Y-%m-%d`)"
            git push
            echo "推送成功!"
          fi